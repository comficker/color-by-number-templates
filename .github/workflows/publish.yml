# Publishes to npm when a version tag is pushed.
#
# Prefers npm's trusted publishing (OIDC), which needs no secret at all: set it
# up once under the package's Settings → Trusted Publisher on npmjs.com, naming
# this repository and `publish.yml`. Until that is configured, the job falls
# back to an NPM_TOKEN repository secret if one exists.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      # A version that is already on the registry is not an error: it means
      # the tag is catching up with a release published by hand. Skip it
      # rather than failing the run over nothing.
      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "color-by-number-templates@$version" version >/dev/null 2>&1; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
            echo "$version is already on the registry; nothing to publish."
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.published == 'no'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
