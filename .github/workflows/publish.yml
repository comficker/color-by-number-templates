# Publishes to npm when a version tag is pushed.
#
# Authentication is npm's trusted publishing (OIDC): the package's Trusted
# Publisher setting on npmjs.com names this repository and this file, so there
# is no token here and no secret in the repository.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Node 22 ships npm 10, and trusted publishing needs 11.5.1 or later —
      # without this the publish falls back to token auth and fails.
      - run: npm install -g npm@^11.5.1
      - run: npm test
      # A version that is already on the registry is not an error: it means
      # the tag is catching up with a release published by hand. Skip it
      # rather than failing the run over nothing.
      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "color-by-number-templates@$version" version >/dev/null 2>&1; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
            echo "$version is already on the registry; nothing to publish."
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.published == 'no'
        run: npm publish --provenance --access public
